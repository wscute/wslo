<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WESIE</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body, html {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      background-color: #070305;
      color: #fff;
    }

    /* خلفية الصورة المحلية bg.jpg */
    .bg-container {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background-color: #070305;
    }

    .bg-media {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,3,5,0.4) 0%, rgba(7,3,5,0.2) 50%, rgba(7,3,5,0.7) 100%);
      z-index: -1;
    }

    /* محتوى الصفحة الرئيسي */
    .content-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px;
      text-align: center;
    }

    .top-section {
      margin-top: 20px;
      animation: fadeInDown 1.2s ease;
    }

    .sparkle {
      font-size: 16px;
      color: #dfb15b;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(223, 177, 91, 0.5);
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 36px;
      font-weight: 500;
      letter-spacing: 8px;
      color: #ffffff;
      margin-bottom: 6px;
      text-shadow: 0 2px 15px rgba(0,0,0,0.6);
    }

    .brand-subtitle {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 5px;
      color: #d1d1d1;
      text-transform: uppercase;
    }

    .middle-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 320px;
      animation: zoomIn 1.2s ease;
    }

    .middle-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 20px;
      color: #f1f1f1;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    /* زر 18+ الفخم */
    .enter-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 56px;
      background: rgba(245, 230, 208, 0.92);
      color: #2b2b2b;
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
      border-radius: 35px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .enter-btn:hover {
      background: #ffffff;
      transform: scale(1.03);
      box-shadow: 0 15px 35px rgba(245, 230, 208, 0.3);
    }

    .bottom-section {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: fadeInUp 1.2s ease;
    }

    .quote-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 16px;
      color: #e2e2e2;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .footer-signature {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 3px;
      color: #a8a8a8;
      text-transform: uppercase;
      margin-top: 5px;
    }

    /* نافذة التحقق ضد الروبوتات */
    #robot-shield-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(7, 3, 5, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 20px;
    }

    .shield-box {
      background: rgba(20, 10, 15, 0.95);
      border: 1px solid rgba(245, 230, 208, 0.3);
      border-radius: 24px;
      width: 100%;
      max-width: 330px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      animation: zoomIn 0.3s ease;
    }

    .shield-title {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      letter-spacing: 3px;
      color: #fff;
      margin-bottom: 10px;
    }

    .shield-desc {
      font-size: 12.5px;
      color: #d1d1d1;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .verify-action-btn {
      background: rgba(245, 230, 208, 0.92);
      color: #2b2b2b;
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
    }

    .verify-action-btn:hover {
      background: #fff;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Background Image المتوافقة مع ملف bg.jpg في GitHub -->
  <div class="bg-container">
    <img src="./bg.jpg" alt="Background" class="bg-media">
  </div>
  <div class="bg-overlay"></div>

  <!-- Main Content Layout -->
  <div class="content-wrapper">
    
    <!-- Top Header -->
    <div class="top-section">
      <div class="sparkle">✦</div>
      <h1 class="brand-title">WESIE</h1>
      <div class="brand-subtitle">Exclusive Space</div>
    </div>

    <!-- Center Interactive Area -->
    <div class="middle-section">
      <div class="middle-text">your little escape</div>
      <button class="enter-btn" onclick="triggerRobotShield()">
        Yes, I'm 18
      </button>
    </div>

    <!-- Bottom Footer Elements -->
    <div class="bottom-section">
      <div class="quote-text">Some things are better a little closer.</div>
      <div class="footer-signature">With Love, Wesie</div>
    </div>

  </div>

  <!-- نافذة الحماية ضد بوتات إنستغرام -->
  <div id="robot-shield-modal">
    <div class="shield-box">
      <div class="shield-title">SECURITY CHECK</div>
      <p class="shield-desc" id="shield-status">Verifying human interaction...</p>
      <button class="verify-action-btn" id="shield-btn" style="display:none;" onclick="redirectToDestination()">Continue</button>
    </div>
  </div>

  <script>
    // نظام فحص البوتات الذكي
    function triggerRobotShield() {
      const modal = document.getElementById('robot-shield-modal');
      const statusText = document.getElementById('shield-status');
      const actionBtn = document.getElementById('shield-btn');
      
      modal.style.display = 'flex';
      statusText.innerText = "Analyzing security fingerprint...";
      actionBtn.style.display = 'none';

      setTimeout(() => {
        statusText.innerText = "Verification successful. Tap continue.";
        actionBtn.style.display = 'block';
      }, 1000);
    }

    // فتح الرابط حصرياً في المتصفح الخارجي (Safari / Google Chrome) بعيداً عن إنستغرام
    function redirectToDestination() {
      const targetUrl = "https://www.stacked.com/@wslo/membership?lang=en";
      
      const a = document.createElement('a');
      a.href = targetUrl;
      a.target = '_blank';
      a.rel = 'noopener external';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  </script>
</body>
</html>
